<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Input Atribut, Checkbox & Radio</title>
  </head>
  <body>
    <form>
    <label for="name"
      >Nama:
      <input
        type="text"
        name="nama"
        id="nama"
        placeholder="Masukkan nama"
        autocomplete="off"
        autofocus required>
    </label>
    <br>
    
    <h3>Hobby</h3>
    <label for="hobby 1">Olahraga
      <input type="checkbox" name="hobby1" id="hobby1" value="olahraga">
      <br>
      <label for="hobby 2">Membaca
        <input type="checkbox" name="hobby2" id="hobby2" value="membaca" checked>
      </label>
    <br>
    <h3>Jenis Kelamin</h3>
    <label for="pria">
      <input type="radio" name="jenis kelamin" id="pria" value="pria">Pria
    </label>
<br>
    <label for="wanita">
      <input type="radio" name="jenis kelamin" id="wanita" value="wanita">Wanita
    </label>

    <br />
    <button type="submit">Kirim!</button>
  </body>
  </form>
</html>
