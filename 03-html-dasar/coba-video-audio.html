<!doctype html>
<html lang="en">
  <head>

    <title>CobaRich Media</title>
  </head>
  <body>
    <h3>Super Ferrari💖</h3>
    <video controls poster="media/superferrari.png" width="300">
      <source type="video/mp4" src="media/cat.mp4" />

      Browser belum support audio player
    </audio>
